[project]
name = "model-due-diligence"
version = "0.1.0"
description = "Static due-diligence scanner for local AI model artefacts and repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]
dependencies = ["rich>=13.7.0", "safetensors>=0.4.0"]

[project.optional-dependencies]
scanners = ["modelscan>=0.8.0", "semgrep>=1.70.0", "bandit>=1.7.8", "pip-audit>=2.7.0", "detect-secrets>=1.5.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "pyright>=1.1.370", "mypy>=1.10.0", "types-setuptools"]

[project.scripts]
model-due-diligence = "model_due_diligence.cli:main"
mdd = "model_due_diligence.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PL", "RUF"]
ignore = ["S603", "S607", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/model_due_diligence --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/model_due_diligence"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
reportMissingTypeStubs = false
