name: CI
on:
  pull_request:
  push:
    branches: ["main"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,scanners]"
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Pyright
        run: pyright
      - name: Mypy
        run: mypy src tests
      - name: Tests
        run: pytest
      - name: Smoke test CLI
        run: mdd tests/fixtures/safe_repo --out ./audit-smoke --fail-on critical --skip-external
