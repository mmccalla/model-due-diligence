name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,scanners,semgrep]"

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Pyright
        run: pyright

      - name: Mypy
        run: mypy src tests

      - name: Tests
        run: pytest

      - name: Smoke test CLI
        run: |
          mdd tests/fixtures/safe_repo \
            --out ./audit-smoke \
            --fail-on critical \
            --skip-external

  build:
    name: Build distribution artefacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomli
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not match:
              print(f"ERROR: tag must look like vX.Y.Z, got {tag!r}", file=sys.stderr)
              sys.exit(1)

          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]

          expected = match.group(1)
          if version != expected:
              print(
                  f"ERROR: pyproject.toml version {version!r} does not match tag {expected!r}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Version check passed: {version}")
          PY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download distribution artefacts
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/project/model-due-diligence/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artefacts
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
